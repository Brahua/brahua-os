name: Reminders tick

# Fires the reminder engine (SPEC-reminders "Motor de avisos") every 15 minutes: POST
# /api/reminders/tick on production with `Authorization: Bearer $REMINDERS_CRON_SECRET`. Vercel
# Hobby only gives one cron a day (vercel.json, 12:30 UTC = 7:30 in Lima: the safety net), so
# the frequent trigger is this workflow. The engine is idempotent (a `dedupe_key` claim per
# reminder and channel), so overlapping or repeated runs never send a reminder twice.
#
#   gh workflow run reminders-tick.yml --ref main      # manual tick
#
# - `schedule` only runs on the default branch, and GitHub pauses it after 60 days without
#   repository activity: the Vercel cron covers that gap for the morning briefing.
# - The secret is set by the owner in their own terminal: `gh secret set REMINDERS_CRON_SECRET`
#   (and the same value as REMINDERS_CRON_SECRET and CRON_SECRET in Vercel). Until it exists the
#   job only warns, so the schedule does not fail every 15 minutes.
# - Cost: 15 minutes ≈ 2 900 Actions minutes a month. Free while the repo is public; before it
#   goes private again (~2026-11-01) change the cron to */30 and 06:00–23:30 Lima
#   (backlog "Minutos de CI").
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # A slow run is not cancelled by the next one: the claim in the engine makes overlap harmless.
  group: reminders-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Call /api/reminders/tick
    # Production only: a dispatch on a branch must not touch it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      TICK_URL: https://os.brahua.com/api/reminders/tick
      REMINDERS_CRON_SECRET: ${{ secrets.REMINDERS_CRON_SECRET }}
    steps:
      - name: Tick
        run: |
          if [ -z "$REMINDERS_CRON_SECRET" ]; then
            echo "::warning::REMINDERS_CRON_SECRET is not set: no tick sent. Set it as described in docs/HANDOFF.md, section \"Cómo funciona reminders → R1\"."
            exit 0
          fi
          # The header goes through stdin, never through the command line.
          status="$(printf 'Authorization: Bearer %s\n' "$REMINDERS_CRON_SECRET" \
            | curl --silent --show-error --max-time 40 --retry 2 --retry-delay 5 \
                --request POST --header @- \
                --output tick.json --write-out '%{http_code}' "$TICK_URL")"
          echo "HTTP $status"
          # The endpoint answers counts only (no text, no ids): safe to print.
          if [ -s tick.json ]; then cat tick.json; echo; fi
          if [ "$status" != "200" ]; then
            echo "::error::The tick endpoint answered HTTP $status (404 means the secret does not match or is not set in Vercel)."
            exit 1
          fi
