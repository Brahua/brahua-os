name: CI/CD

# Trunk-based: short-lived feature branches open PRs against main (CI only).
# Every push to main runs the same checks and, only if all of them pass, deploys to production
# and smoke-tests it.
# workflow_dispatch: update-screenshots.yml pushes with GITHUB_TOKEN, which starts no push or
# pull_request run, so it dispatches this workflow on the branch instead. It never deploys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # The event is part of the group, so a dispatch can never cancel a queued push run on main
  # (that would drop a deploy).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a run on main (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Dispatches exist for update-screenshots.yml on feature branches; on main they would only run
  # checks next to the push runs. Refuse them.
  guard:
    name: Refuse dispatch on main
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::ci.yml is not dispatched on main: pushes to main run it (and deploy)."
          exit 1
      - run: echo "Dispatch on ${{ github.ref_name }}"

  checks:
    name: Lint, types, unit tests, build
    needs: guard
    # Runs when the guard passed or was skipped (push, pull_request), never after it failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm design:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The same build as production (no E2E_ERROR_ROUTES): the routes that force errors are absent.
      - name: No test-only routes in the build
        run: node scripts/check-no-e2e-routes.mjs

  e2e:
    name: E2E (Playwright + axe)
    needs: guard
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same Linux image here and in update-screenshots.yml, so screenshots match
    # (e2e/support/screenshot-env.ts only compares them inside it). Keep the two in sync.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Throwaway database for the app under test (login, protected routes); never production.
    # The job runs in a container, so the service is reached by its name.
    services:
      postgres:
        # Production's major (Neon), pinned like scripts/backup/postgres-images.txt: keep them in sync.
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brahua_os_test
        options: >-
          --health-cmd "pg_isready -U postgres -d brahua_os_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/brahua_os_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The screenshot gate never turns itself off here (playwright.config.ts also throws).
      - name: Screenshots are compared in this job
        run: |
          if [ "$PLAYWRIGHT_BROWSERS_PATH" != "/ms-playwright" ]; then
            echo "::error::Not running in the Playwright image (PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-unset})"
            exit 1
          fi
          if [ "${E2E_SCREENSHOTS:-}" = "0" ]; then
            echo "::error::E2E_SCREENSHOTS=0 is not allowed in CI"
            exit 1
          fi
      - run: pnpm test:e2e
        env:
          HOME: /root
      # Full suite in the image: every committed reference must have been compared.
      - name: No orphan screenshots
        run: node scripts/check-screenshot-orphans.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Integration tests (Postgres)
    needs: guard
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway database for this job only; never production.
    services:
      postgres:
        # Production's major (Neon), pinned like scripts/backup/postgres-images.txt: keep them in sync.
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brahua_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brahua_os_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/brahua_os_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema and committed migrations are in sync
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::The schema changed without a migration. Run pnpm db:generate and commit drizzle/."
            exit 1
          fi
      # Same command as the production build, against the service database. Scoped to this step:
      # the integration tests refuse a TEST_DATABASE_URL equal to DATABASE_URL_UNPOOLED.
      - name: Apply migrations with pnpm db:migrate (production path)
        run: pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test:integration

  deploy:
    name: Deploy to production
    needs: [checks, e2e, integration]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # One production deploy (and its smoke test) at a time, in merge order. queue: max keeps every
    # pending job: by default a newly queued job cancels the pending one (a dropped deploy).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deploy secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name repository secret"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Remote build: the CLI uploads this checkout (minus .vercelignore) and Vercel builds it with
      # vercel.json's buildCommand, scripts/vercel-build.sh (check-auth-env, db:migrate, db:seed,
      # next build; VERCEL_ENV=production there). The database variables are Sensitive: they only
      # exist inside Vercel's build, so building on the runner (vercel pull + build --prebuilt)
      # cannot work. A failed build fails this step; --logs prints the build log here.
      - name: Deploy (build on Vercel; migrates the production database)
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes vercel@61.1.0 deploy --prod --yes --logs --json --token="$VERCEL_TOKEN" > deploy.json
          status=$?
          set -e
          url="$(jq -r '.url // empty' deploy.json 2>/dev/null || true)"
          state="$(jq -r '.readyState // empty' deploy.json 2>/dev/null || true)"
          inspector="$(jq -r '.inspectorUrl // empty' deploy.json 2>/dev/null || true)"
          if [ -n "$inspector" ]; then echo "Deployment and build logs: $inspector"; fi
          if [ "$status" -ne 0 ] || [ "$state" != "READY" ] || [ -z "$url" ]; then
            reason="$(jq -r '.error.message // empty' deploy.json 2>/dev/null || true)"
            echo "::error::Vercel deploy failed (exit $status, state ${state:-unknown}): ${reason:-see the build log above}"
            exit 1
          fi
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    name: Production smoke test
    needs: deploy
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Worst case: about 3 min waiting for the domain plus about 7 min of smoke rounds.
    timeout-minutes: 15
    # Same group as deploy: the next deploy waits until this deployment was checked.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    env:
      PRODUCTION_HOST: os.brahua.com
      DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Read-only Vercel API call: which deployment the production domain points to. The checks
      # below only mean something once it is the one this run just published.
      - name: Wait until the domain serves this deployment
        # The only step that needs the Vercel credentials.
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          expected="${DEPLOYMENT_URL#https://}"
          if [ -z "$expected" ]; then
            echo "::error::The deploy job did not report a deployment URL"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            current="$(timeout 30 npx --yes vercel@61.1.0 inspect "$PRODUCTION_HOST" --json --token="$VERCEL_TOKEN" 2>inspect.err | jq -r '.url // empty' || true)"
            if [ "$current" = "$expected" ]; then
              echo "$PRODUCTION_HOST → $current"
              exit 0
            fi
            echo "Attempt $attempt: $PRODUCTION_HOST → ${current:-unknown}, waiting for $expected"
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "vercel inspect stderr (last attempt):"
          cat inspect.err
          echo "::error::$PRODUCTION_HOST still does not point to $expected"
          exit 1
      # Plain GET requests: never signs in, never writes. A failure fails the run, and GitHub
      # notifies the owner.
      - name: Smoke test https://os.brahua.com
        run: bash scripts/smoke-production.sh
