name: Update screenshots

# Regenerates the E2E screenshot references in the same environment as CI's E2E job, deletes the
# ones no test uses any more, and commits the result to the branch it ran on. Never on main.
#
#   gh workflow run update-screenshots.yml --ref <branch>
#
# A push made with GITHUB_TOKEN starts no workflow run (except workflow_dispatch and
# repository_dispatch), so the last job dispatches ci.yml on the branch: CI checks the bot commit.
on:
  workflow_dispatch:

concurrency:
  group: update-screenshots-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  render:
    name: Render screenshots (Playwright image)
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Runs the test suite (third-party code): read-only token. The commit happens in another job.
    permissions:
      contents: read
    # Keep in sync with the e2e job in ci.yml: same image, browsers, fonts and database.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brahua_os_test
        options: >-
          --health-cmd "pg_isready -U postgres -d brahua_os_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/brahua_os_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Screenshots are compared in this job
        run: |
          if [ "$PLAYWRIGHT_BROWSERS_PATH" != "/ms-playwright" ] || [ "${E2E_SCREENSHOTS:-}" = "0" ]; then
            echo "::error::References must be rendered in the Playwright image with screenshots on"
            exit 1
          fi
      # "changed": rewrites only the references that no longer match (and creates missing ones).
      # Any other failing test fails the job, and nothing is committed.
      - run: pnpm test:e2e --update-snapshots=changed
        env:
          HOME: /root
      - name: Delete orphan references
        run: node scripts/check-screenshot-orphans.mjs --delete
      # The whole set: the commit job mirrors it, so deleted orphans are deleted there too.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: e2e/__screenshots__/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commit:
    name: Commit screenshots and re-run CI
    needs: render
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bot commit
      actions: write # dispatch ci.yml on the branch
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Refuse main
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "::error::update-screenshots never commits to main"
            exit 1
          fi
      # The exact commit that was rendered: if the branch moved since, the push below fails
      # instead of committing references made from other code. No credentials stored in .git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      # The artifact came from a job that ran third-party code: accept only real PNG files at
      # <spec file>/<name>.png, nothing else.
      - name: Accept only PNG references
        run: |
          cd "$RUNNER_TEMP/screenshots"
          bad=0
          while IFS= read -r -d '' entry; do
            entry="${entry#./}"
            if [ -L "$entry" ] || [ ! -f "$entry" ]; then
              echo "::error::Not a regular file: $entry"; bad=1; continue
            fi
            if ! [[ "$entry" =~ ^[A-Za-z0-9_.-]+\.spec\.ts/[A-Za-z0-9_.-]+\.png$ ]] || [[ "$entry" == *..* ]]; then
              echo "::error::Unexpected path: $entry"; bad=1; continue
            fi
            if [ "$(head -c 8 "$entry" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "::error::Not a PNG: $entry"; bad=1
            fi
          done < <(find . -mindepth 1 ! -type d -print0)
          exit $bad
      - name: Commit the changed references
        id: commit
        run: |
          # Mirror the rendered set: changed and new PNGs, and orphans removed.
          find e2e/__screenshots__ -type f -name '*.png' -delete
          mkdir -p e2e/__screenshots__
          cp -R "$RUNNER_TEMP/screenshots/." e2e/__screenshots__/
          git add -A -- 'e2e/__screenshots__/*.png'
          if git diff --cached --quiet; then
            echo "No screenshot changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -v '\.png$'; then
            echo "::error::Only PNG files may be committed"
            exit 1
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(e2e): update screenshots"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The token reaches git only here, as a header for this one command.
      - name: Push
        if: steps.commit.outputs.changed == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$BRANCH"; then
            echo "::error::$BRANCH moved while rendering. Run the workflow again on the new head."
            exit 1
          fi
          {
            echo "Committed $(git rev-parse --short HEAD) to \`$BRANCH\`:"
            echo '```'
            git show --stat --format= HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run CI on the bot commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Dispatched ci.yml on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
