name: Update screenshots

# Regenerates the E2E screenshot references in the same environment as CI's E2E job and commits
# the changed PNGs to the branch it ran on. Never on main.
#
#   gh workflow run update-screenshots.yml --ref <branch>
#
# A push made with GITHUB_TOKEN starts no workflow run (except workflow_dispatch and
# repository_dispatch), so the last job dispatches ci.yml on the branch: CI checks the bot commit.
on:
  workflow_dispatch:

concurrency:
  group: update-screenshots-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  render:
    name: Render screenshots (Playwright image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Runs the test suite (third-party code): read-only token. The commit happens in another job.
    permissions:
      contents: read
    # Keep in sync with the e2e job in ci.yml: same image, browsers, fonts and database.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brahua_os_test
        options: >-
          --health-cmd "pg_isready -U postgres -d brahua_os_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/brahua_os_test
    steps:
      - name: Refuse main (and anything that is not a branch)
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "$REF" = "refs/heads/main" ]; then
            echo "::error::Run it on a feature branch: gh workflow run update-screenshots.yml --ref <branch>"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # "changed": rewrites only the references that no longer match (and creates missing ones).
      # Any other failing test fails the job, and nothing is committed.
      - run: pnpm test:e2e --update-snapshots=changed
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: e2e/__screenshots__/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commit:
    name: Commit screenshots and re-run CI
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bot commit
      actions: write # dispatch ci.yml on the branch
    env:
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse main
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "::error::update-screenshots never commits to main"
            exit 1
          fi
      # The exact commit that was rendered: if the branch moved since, the push below fails
      # instead of committing references made from other code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: e2e/__screenshots__/
      - name: Commit and push the changed references
        id: push
        run: |
          git add -A e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No screenshot changed."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(e2e): update screenshots"
          if ! git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "::error::$BRANCH moved while rendering. Run the workflow again on the new head."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          {
            echo "Committed $(git rev-parse --short HEAD) to \`$BRANCH\`:"
            echo '```'
            git show --stat --format= HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run CI on the bot commit
        if: steps.push.outputs.pushed == 'true'
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Dispatched ci.yml on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
